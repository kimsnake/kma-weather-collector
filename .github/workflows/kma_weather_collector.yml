name: KMA Weather Collector & Sync

on:
  workflow_dispatch: # 외부 cron-job.org 등에서 수동/원격 트리거 가능

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 수집기 레포 체크아웃
      - name: Checkout Collector Repo
        uses: actions/checkout@v4

      # 2. Python 및 uv 세팅
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync

      # 3. 파이썬 실행 전, 스토리지 레포를 먼저 가져와서 기존 데이터 파일 세팅 (데이터 유실 방지)
      - name: Pull Existing Data from Storage Repo
        env:
          STORAGE_PAT: ${{ secrets.STORAGE_KEY }}
        run: |
          git config --global url."https://${{ secrets.STORAGE_KEY }}@github.com/".insteadOf "https://github.com/"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git clone https://github.com/kimsnake/kma-weather-storage.git storage_temp
          
          # 기존에 수집되어 있던 데이터 폴더들이 있다면 현재 수집기 레포 위치로 복사해오기
          for folder in latest_weather_data weather_current_data weather_forecast_data weather_vilage_data; do
            if [ -d "storage_temp/$folder" ]; then
              mkdir -p "$folder"
              cp -r storage_temp/$folder/* "$folder"/ 2>/dev/null || true
            fi
          done

      # 4. 작업 시작 시간 기록 (TZ를 KST로 설정하여 타임스탬프 획득)
      - name: Record Start Time
        id: time
        run: |
          echo "START_TIME=$(TZ='Asia/Seoul' date +%s)" >> $GITHUB_ENV

      # 5. 날씨 데이터 수집 스크립트 실행 (기존 데이터가 있는 상태이므로 mode='a'가 정상 작동)
      - name: Run Weather Collectors
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: |
          echo "==> [1/3] Running current_collector.py..."
          uv run python current_collector.py
          
          echo "==> [2/3] Running forecast_collector.py..."
          uv run python forecast_collector.py
          
          echo "==> [3/3] Running vilage_collector.py..."
          uv run python vilage_collector.py

      # 6. 저장소(kma-weather-storage) 레포로 데이터 및 깔끔한 로그 푸시
      - name: Push Data and Log to Storage Repo
        env:
          STORAGE_PAT: ${{ secrets.STORAGE_KEY }}
        run: |
          # Git 기본 설정
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          
          # 한국 시간(KST) 기준으로 종료 시간 및 소요 시간 계산
          END_TIME=$(TZ='Asia/Seoul' date +%s)
          DURATION=$(( END_TIME - START_TIME ))
          START_FORMATTED=$(TZ='Asia/Seoul' date -d "@$START_TIME" "+%Y-%m-%d %H:%M:%S" 2>/dev/null || TZ='Asia/Seoul' date -r "$START_TIME" "+%Y-%m-%d %H:%M:%S")
          END_FORMATTED=$(TZ='Asia/Seoul' date -d "@$END_TIME" "+%Y-%m-%d %H:%M:%S" 2>/dev/null || TZ='Asia/Seoul' date -r "$END_TIME" "+%Y-%m-%d %H:%M:%S")
          
          # 소요 시간이 60초를 초과하면 FAIL, 그 외는 SUCCESS 판정
          if [ "$DURATION" -gt 60 ]; then
            STATUS="FAIL"
          else
            STATUS="SUCCESS"
          fi
          
          # 이미 3번 스텝에서 클론해 둔 storage_temp를 storage_repo로 이름 변경하여 재활용
          mv storage_temp storage_repo
          cd storage_repo
          
          # 원격 레포지토리에 이미 쌓여있는 최신 로그 내용 동기화
          git pull origin main || true
          
          # 누적 로그 디렉토리 생성 및 CSV 기록
          mkdir -p meta_logs
          LOG_FILE="meta_logs/collection_history.csv"
          
          if [ ! -f "$LOG_FILE" ]; then
            echo "start_time,end_time,duration_sec,status" > "$LOG_FILE"
          fi
          
          echo "$START_FORMATTED,$END_FORMATTED,$DURATION,$STATUS" >> "$LOG_FILE"
          
          cd ..
          
          # 새로 수집된 데이터 폴더들을 스토리지 레포로 복사
          for folder in latest_weather_data weather_current_data weather_forecast_data weather_vilage_data; do
            if [ -d "$folder" ]; then
              cp -r "$folder" storage_repo/
            fi
          done
          
          cd storage_repo
          git add .
          
          # 변경된 파일이 있을 때만 커밋 및 푸시
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update weather data and log (${DURATION}s) [skip ci]"
            git push origin main
          fi